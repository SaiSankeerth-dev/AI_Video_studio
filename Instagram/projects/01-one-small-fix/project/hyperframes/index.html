    <script type="module">
      import { initStudioStage } from "./assets/scene3d.js";
      import { renderCardDOM } from "./assets/cards.js";
      import {
        TOTAL_DURATION,
        getShotAt,
        getSubtitleAt,
        sampleEnvelope,
      } from "./assets/timeline_data.js";

      const canvas = document.getElementById("stage3d");
      const cardLayer = document.getElementById("card-layer");
      const subBox = document.getElementById("sub-box");
      const subSpeaker = document.getElementById("sub-speaker");
      const subText = document.getElementById("sub-text");

      const stage = initStudioStage(canvas, { width: 1080, height: 1920 });
      let lastRenderedTime = -1;

      function renderFrame(rawTime) {
        const t = Math.max(0, Math.min(TOTAL_DURATION, Number(rawTime) || 0));
        if (Math.abs(t - lastRenderedTime) < 1e-5) return;
        lastRenderedTime = t;

        const shot = getShotAt(t);
        const shotProgress = Math.max(
          0,
          Math.min(1, (t - shot.start) / Math.max(0.001, shot.duration))
        );
        const amp = shot.line
          ? sampleEnvelope(shot.line, t - shot.voiceStart)
          : 0;

        stage.renderAt(t, {
          cam: shot.cam,
          shotProgress,
          pushZoom: shot.pushZoom,
          tariqExpr: shot.tariqExpr,
          tariqPose: shot.tariqPose,
          tariqTurn: shot.tariqTurn,
          tariqAmp: shot.speaker === "tariq" ? amp : 0,
          kipMood: shot.kipMood,
          kipAmp: shot.speaker === "claude" ? amp : 0,
          kipSweat: shot.kipSweat,
          kipTilt: shot.kipTilt,
          kipHop: shot.kipHop,
          kipWave: shot.kipWave,
          holoMode: shot.holoMode,
          foreshadowAlert: shot.foreshadowAlert,
          freeze: shot.freeze,
        });

        renderCardDOM(cardLayer, {
          card: shot.card,
          shotProgress,
        });

        const cue = getSubtitleAt(t);
        if (cue) {
          subBox.style.display = "inline-block";
          subSpeaker.textContent = cue.speaker === "tariq" ? "Tariq" : "Claude";
          subSpeaker.className = cue.speaker === "tariq" ? "spk-tariq" : "spk-claude";
          subText.textContent = cue.text;
        } else {
          subBox.style.display = "none";
        }
      }

      window.__timelines = window.__timelines || {};
      const clock = { t: 0 };
      const mainTl = gsap.timeline({ paused: true });
      mainTl.to(
        clock,
        {
          t: TOTAL_DURATION,
          duration: TOTAL_DURATION,
          ease: "none",
          onUpdate: () => renderFrame(clock.t),
        },
        0
      );
      window.__timelines["main"] = mainTl;

      window.addEventListener("hf-seek", (e) => {
        if (e && e.detail && typeof e.detail.time === "number") {
          renderFrame(e.detail.time);
        }
      });

      renderFrame(0);
    </script>
